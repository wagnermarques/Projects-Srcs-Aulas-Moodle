<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Questões - Dockerfile, Armazenamento e Compose</title>
  <script src="scorm_api.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1e293b;
      background: #f8fafc;
      margin: 0;
      padding: 30px 15px;
    }
    .quiz-container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    h1 {
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-top: 0;
    }
    .q-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      transition: all 0.2s ease;
    }
    .q-card.correct {
      border-left: 5px solid #10b981;
      background: #f0fdf4;
    }
    .q-card.incorrect {
      border-left: 5px solid #ef4444;
      background: #fef2f2;
    }
    .q-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #1e293b;
    }
    .q-body {
      margin-bottom: 15px;
      color: #334155;
    }
    .option-label {
      display: block;
      padding: 10px 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .option-label:hover {
      background: #f1f5f9;
    }
    .input-text {
      width: 100%;
      max-width: 400px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }
    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 15px;
    }
    .match-left {
      flex: 1;
      font-weight: 500;
    }
    .match-select {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .feedback-box {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      display: none;
    }
    .feedback-box.show {
      display: block;
    }
    .fb-correct {
      background: #dcfce7;
      color: #166534;
    }
    .fb-incorrect {
      background: #fee2e2;
      color: #991b1b;
    }
    .btn-submit {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-submit:hover {
      background: #0369a1;
    }
    .score-banner {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>📝 Banco de Questões - Dockerfile, Armazenamento e Compose</h1>
    <p>Responda às questões abaixo e clique em <strong>Submeter Respostas</strong> para validar e enviar sua nota para o Moodle.</p>
    
    <div id="questions-root"></div>
    
    <button class="btn-submit" id="btn-submit" onclick="gradeQuiz()">Submeter Respostas</button>
    <div class="score-banner" id="score-banner"></div>
  </div>

  <script>
    const quizData = [{"id": "q_1", "type": "matching", "title": "Instruções do Dockerfile", "properties": {"TYPE": "matching", "DEFAULTGRADE": "1.0", "FEEDBACK": "Cada instrução no Dockerfile cria uma camada ou define metadados para a imagem gerada."}, "body": "Relacione cada instrução do **Dockerfile** com sua respectiva finalidade:", "options": [{"left": "FROM", "right": "Define a imagem base a partir da qual a nova imagem será construída."}, {"left": "WORKDIR", "right": "Define o diretório de trabalho padrão para todas as instruções subsequentes no container."}, {"left": "RUN", "right": "Executa comandos durante o build da imagem criando uma nova camada imutável."}, {"left": "CMD", "right": "Especifica o comando e argumentos padrão que serão executados quando o container iniciar."}, {"left": "EXPOSE", "right": "Documenta em quais portas de rede o container escuta conexões em tempo de execução."}, {"left": "ENV", "right": "Define variáveis de ambiente disponíveis tanto durante o build quanto na execução do container."}]}, {"id": "q_2", "type": "multichoice", "title": "Diferença entre RUN e CMD no Dockerfile", "properties": {"TYPE": "multichoice", "SINGLE": "true", "SHUFFLE": "true", "DEFAULTGRADE": "1.0", "FEEDBACK": "RUN executa no momento da construção da imagem (build-time) criando camadas; CMD define o processo principal que rodará quando o container for iniciado (runtime)."}, "body": "Qual é a diferença fundamental entre as instruções =RUN= e =CMD= em um =Dockerfile=?", "options": [{"text": "=RUN= é executado durante o processo de build da imagem para instalar dependências, enquanto =CMD= define o comando padrão executado ao iniciar o container.", "is_correct": true, "feedback": "Correto! RUN ocorre em build-time e CMD em runtime."}, {"text": "=RUN= executa apenas em containers com interface gráfica, enquanto =CMD= roda no terminal.", "is_correct": false, "feedback": "Incorreto. Ambos rodam em linha de comando no ambiente do container."}, {"text": "=CMD= compila o código-fonte em binário e =RUN= apenas baixa imagens do Docker Hub.", "is_correct": false, "feedback": "Incorreto."}, {"text": "Não há diferença, ambas são instruções equivalentes e intercambiáveis.", "is_correct": false, "feedback": "Incorreto. Suas finalidades e fases de execução são completamente distintas."}]}, {"id": "q_3", "type": "truefalse", "title": "Persistência de Dados com Docker Volumes", "properties": {"TYPE": "truefalse", "DEFAULTGRADE": "1.0", "FEEDBACK": "Volumes Docker são gerenciados fora do ciclo de vida dos containers, garantindo que a remoção de um container não delete os dados gravados no volume."}, "body": "Quando um container Docker que utiliza um **Volume** (=docker volume=) é destruído através do comando =docker rm=, todos os dados salvos dentro desse volume são permanentemente apagados do disco.", "options": [{"text": "True", "is_correct": false, "feedback": "Incorreto. Volumes são persistentes e independentes do ciclo de vida do container."}, {"text": "False", "is_correct": true, "feedback": "Correto! Volumes são criados e armazenados no host independentemente dos containers, sobrevivendo à deleção do container."}]}, {"id": "q_4", "type": "shortanswer", "title": "Comando para Subir Stack do Docker Compose", "properties": {"TYPE": "shortanswer", "DEFAULTGRADE": "1.0", "FEEDBACK": "O comando 'docker compose up -d' ou 'docker-compose up -d' inicia todos os serviços declarados no arquivo YAML em segundo plano."}, "body": "Qual comando completo do Docker Compose é utilizado para criar, iniciar e rodar todos os serviços definidos no =docker-compose.yml= em segundo plano (*detached mode*)?", "options": [{"text": "docker compose up -d", "is_correct": true, "feedback": "Correto! Sintaxe moderna com o plugin Compose v2."}, {"text": "docker-compose up -d", "is_correct": true, "feedback": "Correto! Sintaxe clássica do Compose v1."}]}, {"id": "q_5", "type": "multichoice", "title": "Comunicação entre Containers via Rede Docker", "properties": {"TYPE": "multichoice", "SINGLE": "true", "SHUFFLE": "true", "DEFAULTGRADE": "1.0", "FEEDBACK": "O DNS interno do Docker permite resolução de nomes automática entre containers na mesma rede customizada."}, "body": "Ao conectar múltiplos containers a uma mesma rede customizada (*User-defined Bridge Network*), como um container de backend pode se comunicar com um container de banco de dados chamado =banco-postgres=?", "options": [{"text": "Utilizando o próprio nome do container (=banco-postgres=) como hostname de conexão, graças ao DNS interno do Docker.", "is_correct": true, "feedback": "Correto! O Docker resolve o nome do container diretamente para seu IP interno."}, {"text": "Obrigatoriamente descobrindo e configurando o endereço IP dinâmico atribuído pelo roteador da rede física.", "is_correct": false, "feedback": "Incorreto. O DNS interno torna desnecessário fixar ou descobrir IPs manuais."}, {"text": "Apenas através de um cabo de rede virtual configurado na placa-mãe do host.", "is_correct": false, "feedback": "Incorreto."}, {"text": "Containers nunca conseguem se comunicar diretamente sem mapear portas públicas no host.", "is_correct": false, "feedback": "Incorreto. Redes internas permitem comunicação isolada sem expor portas ao mundo exterior."}]}];

    function renderQuiz() {
      const root = document.getElementById('questions-root');
      root.innerHTML = '';

      quizData.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = 'card-' + q.id;

        let contentHtml = `<div class="q-title">Questão ${idx + 1}: ${escapeHtml(q.title)}</div>`;
        if (q.body) {
          contentHtml += `<div class="q-body">${escapeHtml(q.body)}</div>`;
        }

        if (q.type === 'multichoice' || q.type === 'truefalse') {
          q.options.forEach((opt, oIdx) => {
            contentHtml += `
              <label class="option-label">
                <input type="radio" name="${q.id}" value="${oIdx}">
                ${escapeHtml(opt.text)}
              </label>
            `;
          });
        } else if (q.type === 'shortanswer') {
          contentHtml += `
            <div>
              <input type="text" class="input-text" id="input-${q.id}" placeholder="Digite sua resposta...">
            </div>
          `;
        } else if (q.type === 'matching') {
          const rights = q.options.map(o => o.right).sort(() => Math.random() - 0.5);
          q.options.forEach((opt, mIdx) => {
            contentHtml += `
              <div class="match-row">
                <span class="match-left">${escapeHtml(opt.left)}</span>
                <select class="match-select" id="match-${q.id}-${mIdx}">
                  <option value="">-- Escolha a correspondência --</option>
                  ${rights.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}
                </select>
              </div>
            `;
          });
        }

        contentHtml += `<div class="feedback-box" id="fb-${q.id}"></div>`;
        card.innerHTML = contentHtml;
        root.appendChild(card);
      });
    }

    function gradeQuiz() {
      let total = quizData.length;
      let score = 0;

      quizData.forEach((q, idx) => {
        const card = document.getElementById('card-' + q.id);
        const fb = document.getElementById('fb-' + q.id);
        let isCorrect = false;
        let feedbackText = "";

        if (q.type === 'multichoice' || q.type === 'truefalse') {
          const checked = document.querySelector(`input[name="${q.id}"]:checked`);
          if (checked) {
            const optIdx = parseInt(checked.value, 10);
            const opt = q.options[optIdx];
            if (opt.is_correct) {
              isCorrect = true;
              feedbackText = opt.feedback || "Correto!";
            } else {
              feedbackText = opt.feedback || "Incorreto.";
            }
          } else {
            feedbackText = "Nenhuma alternativa selecionada.";
          }
        } else if (q.type === 'shortanswer') {
          const inputVal = (document.getElementById('input-' + q.id).value || '').trim().toLowerCase();
          const correctOpts = q.options.filter(o => o.is_correct || o.text).map(o => o.text.trim().toLowerCase());
          if (correctOpts.includes(inputVal)) {
            isCorrect = true;
            feedbackText = "Correto!";
          } else {
            feedbackText = `Incorreto. Resposta esperada: ${q.options[0] ? q.options[0].text : ''}`;
          }
        } else if (q.type === 'matching') {
          let matchAll = true;
          q.options.forEach((opt, mIdx) => {
            const sel = document.getElementById(`match-${q.id}-${mIdx}`);
            if (!sel || sel.value !== opt.right) {
              matchAll = false;
            }
          });
          isCorrect = matchAll;
          feedbackText = isCorrect ? "Todas as associações corretas!" : "Algumas associações estão incorretas.";
        }

        card.className = 'q-card ' + (isCorrect ? 'correct' : 'incorrect');
        fb.className = 'feedback-box show ' + (isCorrect ? 'fb-correct' : 'fb-incorrect');
        fb.innerHTML = feedbackText;

        if (isCorrect) {
          score++;
        }
      });

      const percentage = (score / total) * 100;
      const banner = document.getElementById('score-banner');
      banner.style.display = 'block';
      banner.style.background = percentage >= 60 ? '#ecfdf5' : '#fef2f2';
      banner.style.color = percentage >= 60 ? '#065f46' : '#991b1b';
      banner.style.border = `2px solid ${percentage >= 60 ? '#10b981' : '#ef4444'}`;
      banner.innerHTML = `Sua Pontuação: ${score} de ${total} (${percentage.toFixed(0)}%)`;

      // Report score to Moodle SCORM API
      if (typeof scorm !== 'undefined') {
        scorm.complete(percentage);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', renderQuiz);
  </script>
</body>
</html>
