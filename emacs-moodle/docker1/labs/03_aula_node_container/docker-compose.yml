version: '3.8'

services:
  aula_node:
    image: node:20-alpine
    container_name: aula_node
    working_dir: /app
    ports:
      - "8080:3000"
    volumes:
      - ./app:/app
    environment:
      - PORT=3000
      - NODE_ENV=development
      - APP_NAME=Docker Node.js Class
      - SAUDACAO=Olá direto do Container Node.js!
    command: node server.js
    restart: unless-stopped
